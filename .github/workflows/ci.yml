name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Code Quality & Lint Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Syntax & Lint Validation
        run: |
          if [ -d "PR6/backend" ]; then cd PR6/backend; else cd backend; fi
          node -c server.js
          echo "Syntax check passed successfully."

  build-and-test:
    name: Build & Automated Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          if [ -d "PR6/backend" ]; then cd PR6/backend; else cd backend; fi
          npm install

      - name: Run Automated Tests
        run: |
          if [ -d "PR6/backend" ]; then cd PR6/backend; else cd backend; fi
          npm test
